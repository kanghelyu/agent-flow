<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentFlow Studio</title>
<style>
:root{
  --bg:#f7f8fa;--layer:#ffffff;--layer2:#f1f3f7;--border:#e2e6ee;--border2:#cdd4e0;
  --ink:#1c2430;--ink2:#68738a;--brand:#4f6ef7;--on-brand:#fff;
  --ok:#1f9d63;--warn:#c98a1c;--err:#d64550;
  --node-w:208px;--node-h:116px;
}
:root[data-theme="dark"]{
  --bg:#101216;--layer:#171a20;--layer2:#20242c;--border:#2b303a;--border2:#3a414e;
  --ink:#eef2f8;--ink2:#aeb7c6;--brand:#78a8ff;--on-brand:#101216;--ok:#60d394;--warn:#f1c86b;--err:#ff7f87
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101216;--layer:#171a20;--layer2:#20242c;--border:#2b303a;--border2:#3a414e;
    --ink:#eef2f8;--ink2:#aeb7c6;--brand:#78a8ff;--on-brand:#101216;--ok:#60d394;--warn:#f1c86b;--err:#ff7f87
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
button:disabled{opacity:0.38;cursor:default}
.topbar{flex:none;display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;overflow-y:hidden;padding:8px 14px;background:var(--layer);border-bottom:1px solid var(--border);z-index:5;scrollbar-width:thin}
.topbar>*{flex:0 0 auto}
.topbar .logo{display:flex;align-items:center;gap:7px;font-weight:750}
.topbar .logo .spark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:800}
.topbar select,.topbar input{border:1px solid var(--border2);border-radius:7px;background:var(--layer2);color:var(--ink);padding:5px 8px;outline:0;min-width:140px;flex:0 0 auto}
.topbar select:focus,.topbar input:focus{border-color:var(--brand)}
.btn{border:1px solid var(--border2);border-radius:8px;background:var(--layer2);color:var(--ink);padding:5px 10px;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--layer2))}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:650}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--err)}
.btn.mini{padding:2px 8px;font-size:11px}
.progress{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:12px}
.progress .bar{width:110px;height:7px;border-radius:99px;background:var(--layer2);border:1px solid var(--border);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--brand);transition:width .3s ease}
.sync-state{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--layer2);color:var(--ink2);white-space:nowrap}
.sync-state.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.sync-state.bad{color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent)}
.sync-state.saving{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.status{margin-left:auto;color:var(--ink2);font-size:12px;min-width:180px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;min-width:0;min-height:0}
.docrail{flex:none;width:264px;display:flex;flex-direction:column;background:var(--layer);border-right:1px solid var(--border);min-width:0;min-height:0;transition:width .18s ease}
.docrail.collapsed{width:42px}
.docrail.collapsed .docrail-list,.docrail.collapsed .docrail-title{display:none}
.docrail-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);min-height:46px}
.docrail-title{font-size:13px;font-weight:700}
.docrail-toggle{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--ink2);cursor:pointer;font-size:14px}
.docrail-toggle:hover{background:var(--layer2);color:var(--brand)}
.docrail-list{flex:1;min-width:0;min-height:0;overflow:auto;padding:9px;display:flex;flex-direction:column;gap:6px}
.docgroup{padding:5px 7px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.docitem{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;align-items:start;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);padding:8px;cursor:pointer}
.docitem:hover{background:var(--layer2);border-color:var(--border)}
.docitem.active{background:color-mix(in srgb,var(--brand) 10%,var(--layer));border-color:color-mix(in srgb,var(--brand) 45%,var(--border));color:var(--brand)}
.docitem__icon{width:24px;height:28px;border:1px solid currentColor;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:800;opacity:.76}
.docitem__label{display:block;font-size:12px;font-weight:650;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.docitem__path{display:block;font:9px/1.4 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.splitter{flex:none;width:9px;background:var(--layer);cursor:col-resize;touch-action:none;position:relative;display:grid;place-items:center}
.splitter::before{content:"";position:absolute;inset:0 3px;background:var(--border)}
.splitter::after{content:"";width:3px;height:42px;border-radius:99px;background:var(--border2);box-shadow:0 -7px 0 var(--border2),0 7px 0 var(--border2)}
.splitter:hover::before{background:var(--brand)}
.canvas{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;user-select:none;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--border2) 1.1px,transparent 1.2px),
    radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--brand) 6%,transparent),transparent 52%);
  background-size:24px 24px,100% 100%;cursor:grab;touch-action:none}
.canvas.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--brand);stroke-width:2.6;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 2px color-mix(in srgb,var(--brand) 36%,transparent))}
.edge.active{opacity:1}.edge.inactive{opacity:.28;stroke-dasharray:4 5}.edge.pending{opacity:.58;stroke-dasharray:8 5}
.edge.sel{stroke-width:3.8;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--brand) 58%,transparent))}
.edge-hit{fill:none;stroke:transparent;stroke-width:18;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
.conn{fill:none;stroke:var(--brand);stroke-width:2;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;pointer-events:none}
.edge-label-bg{fill:var(--layer);stroke:var(--border);vector-effect:non-scaling-stroke}
.edge-label{fill:var(--ink);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.node{position:absolute;width:var(--node-w);height:var(--node-h);cursor:grab;transition:filter .15s}
.node.dragging{cursor:grabbing;filter:drop-shadow(0 14px 32px color-mix(in srgb,var(--ink) 18%,transparent))}
.card{width:100%;height:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:12px;overflow:hidden;
  background:color-mix(in srgb,var(--layer) 96%,var(--brand) 4%);box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 9%,transparent);
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
.node:hover .card{border-color:color-mix(in srgb,var(--brand) 55%,var(--border2));transform:translateY(-1px);box-shadow:0 12px 30px color-mix(in srgb,var(--ink) 12%,transparent)}
.node.sel .card{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent),0 12px 30px color-mix(in srgb,var(--ink) 12%,transparent)}
.node.ready .card{border-color:color-mix(in srgb,var(--ok) 60%,var(--border2))}
.node.skipped{opacity:.48}.node.skipped .card{border-style:dashed}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.k-input .kind{color:var(--ok)} .k-agent .kind{color:var(--brand)} .k-mapAgent .kind{color:var(--warn)}
.k-condition .kind{color:var(--warn)} .k-merge .kind{color:var(--ink2)} .k-output .kind{color:var(--err)}
.gate-chip{padding:1px 6px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);font-weight:700}
.nlabel{font-weight:650;font-size:13px;word-break:break-word}
.nprompt{margin-top:5px;font-size:11px;color:var(--ink2);white-space:pre-wrap;max-height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.npath{margin-top:7px;padding-top:6px;border-top:1px solid var(--border);font:10px/1.3 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-mark{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--ok);color:#fff;font-size:12px;font-weight:800;border:2px solid var(--bg);box-shadow:0 2px 8px color-mix(in srgb,var(--ok) 40%,transparent);z-index:2}
.formula{position:absolute;left:10px;right:10px;bottom:6px;font:9px/1.2 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:nowrap;overflow:hidden}
.handle{position:absolute;top:50%;width:13px;height:13px;padding:0;border:2px solid var(--bg);border-radius:50%;background:var(--brand);
  transform:translateY(-50%);cursor:crosshair;z-index:3;box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 65%,var(--border2));
  transition:transform .14s ease,box-shadow .14s ease}
.handle.t{left:-6px} .handle.s{right:-6px}
.handle:hover,.handle:focus-visible{transform:translateY(-50%) scale(1.18);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent);outline:0}
.node.hover-target .card{outline:2px solid var(--brand);outline-offset:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent),0 10px 28px color-mix(in srgb,var(--ink) 18%,transparent)}
.controls{position:absolute;left:12px;bottom:12px;display:grid;border:1px solid var(--border2);border-radius:9px;overflow:hidden;background:var(--layer);box-shadow:0 8px 20px color-mix(in srgb,var(--ink) 10%,transparent)}
.controls button{width:34px;height:30px;border:0;border-bottom:1px solid var(--border);background:var(--layer2);color:var(--ink);font-weight:750}
.controls button:last-child{border-bottom:0}
.controls button:hover{background:color-mix(in srgb,var(--brand) 10%,var(--layer2));color:var(--brand)}
.addbar{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-top:1px solid var(--border);background:var(--layer);flex-wrap:wrap}
.addbar .hint{margin-left:auto;color:var(--ink2);font-size:10px}
.inspector{flex:none;width:340px;display:flex;flex-direction:column;background:var(--layer);border-left:1px solid var(--border);min-width:0;min-height:0}
.inspector .scroll{flex:1;min-width:0;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.inspector h3{margin:0;font-size:14px}
.inspector label{display:grid;gap:4px;color:var(--ink2);font-size:12px}
.inspector input,.inspector select,.inspector textarea{width:100%;border:1px solid var(--border2);border-radius:7px;background:var(--layer2);color:var(--ink);padding:6px 8px;outline:0}
.inspector input:focus,.inspector select:focus,.inspector textarea:focus{border-color:var(--brand)}
.inspector textarea{min-height:220px;resize:none;font:11px/1.55 ui-monospace,Menlo,monospace}
.pathbox{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--layer2)}
.pathbox .k{font-size:10px;color:var(--ink2)} .pathbox .v{font:10px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);font-size:11px}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--border))}
.dialog-bg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(4px)}
.dialog{width:min(540px,92vw);max-height:80vh;overflow:auto;padding:18px;border:1px solid var(--border2);border-radius:14px;background:var(--layer);box-shadow:0 20px 60px color-mix(in srgb,var(--ink) 18%,transparent)}
.dialog h3{margin:0 0 8px;font-size:15px}
.dialog p{margin:0;color:var(--ink2);font-size:12px;line-height:1.6}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.gate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.gate-choice{display:flex;min-height:74px;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--border2);border-radius:11px;background:var(--layer2);padding:10px}
.gate-choice:hover{border-color:var(--brand)}
.gate-choice strong{font-size:12px;color:var(--brand)}
.gate-choice span{font-size:10px;color:var(--ink2)}
.branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.branch-grid button{min-height:50px;border:1px solid var(--border2);border-radius:11px;background:var(--layer2);font-size:14px;font-weight:750}
.branch-grid button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.branch-grid button:disabled{opacity:.38;text-decoration:line-through}
.eval-panel{position:absolute;right:14px;top:14px;width:300px;max-height:60%;overflow:auto;z-index:20;padding:12px;border:1px solid var(--border2);border-radius:12px;background:var(--layer);box-shadow:0 14px 36px color-mix(in srgb,var(--ink) 16%,transparent);display:none}
.eval-panel.open{display:block}
.eval-panel textarea{width:100%;min-height:64px;border:1px solid var(--border2);border-radius:8px;background:var(--layer2);color:var(--ink);font:11px/1.5 ui-monospace,Menlo,monospace}
.eval-out{margin-top:8px;font:10px/1.5 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:pre-wrap;word-break:break-all}
.empty{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:24px;pointer-events:none}
.empty .card{width:max-content;max-width:min(92%,430px);padding:22px 26px;border:1px dashed var(--border2);border-radius:14px;background:var(--layer);color:var(--ink2);font-size:12px;line-height:1.7;text-align:center;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 10%,transparent);pointer-events:auto}
.empty .card strong{display:block;margin-bottom:6px;color:var(--ink);font-size:13px}
.empty .card .btn{margin-top:8px}
body.pet .topbar,body.pet .addbar,body.pet .inspector,body.pet .eval-panel,body.pet .controls,body.pet .docrail,body.pet .splitter{display:none}
body.pet{background:transparent;overflow:hidden}
body.pet .main,body.pet .canvas{background:transparent}
body.pet .canvas{background-image:none;cursor:default}
.pet-card{position:absolute;inset:5px;border-radius:16px;border:1px solid color-mix(in srgb,var(--border2) 76%,transparent);
  background:color-mix(in srgb,var(--layer2) 97%,transparent);display:grid;grid-template-columns:46px minmax(0,1fr) 52px;align-items:center;
  gap:8px;padding:8px 8px 8px 10px;box-shadow:0 8px 22px color-mix(in srgb,#000 15%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);user-select:none;overflow:hidden;-webkit-app-region:drag}
.pet-drag{position:absolute;left:0;right:0;top:0;height:18px;cursor:grab;z-index:0}
.pet-avatar{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--brand) 8%,var(--layer));
  border:1px solid color-mix(in srgb,var(--brand) 14%,var(--border));display:grid;place-items:center;position:relative;
  -webkit-app-region:no-drag;cursor:pointer;transition:transform .16s ease,background .2s ease;z-index:1}
.pet-kitty{width:30px;height:29px;position:relative;display:grid;place-items:end center}
.pet-ear{position:absolute;top:1px;width:10px;height:12px;background:var(--ink);border-radius:3px 8px 3px 8px;transform:rotate(15deg)}
.pet-ear.left{left:3px;transform:rotate(-15deg) scaleX(-1)}.pet-ear.right{right:3px}
.pet-face{width:28px;height:24px;border-radius:12px 12px 13px 13px;background:var(--ink);position:relative;z-index:1}
.pet-eye{position:absolute;top:8px;width:3px;height:5px;border-radius:99px;background:var(--layer2)}
.pet-eye.left{left:7px}.pet-eye.right{right:7px}
.pet-nose{position:absolute;left:50%;top:14px;width:3px;height:2px;border-radius:50%;background:var(--layer2);transform:translateX(-50%)}
.pet-mouth{position:absolute;left:50%;bottom:4px;width:7px;height:3px;border-bottom:1.5px solid var(--layer2);border-radius:0 0 8px 8px;transform:translateX(-50%)}
.pet-avatar[data-state="working"] .pet-eye{height:3px;top:9px}.pet-avatar[data-state="done"]{background:color-mix(in srgb,#39a96b 11%,var(--layer))}
.pet-avatar[data-state="idle"]{opacity:.9}.pet-avatar.poke{animation:petPoke .42s ease}.pet-avatar.flail{animation:petFlail .65s ease}
@keyframes petPoke{0%,100%{transform:scale(1)}45%{transform:scale(.9) translateY(2px)}70%{transform:scale(1.04) translateY(-1px)}}
@keyframes petFlail{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) translateY(-2px)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}}
.pet-info{min-width:0;display:flex;flex-direction:column;gap:4px;z-index:1}
.pet-card .t{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:760;min-width:0}
.pet-card .t .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-health{width:8px;height:8px;border-radius:50%;background:#858b98;box-shadow:0 0 0 3px color-mix(in srgb,#858b98 15%,transparent);flex:none}
.pet-health[data-valid="true"]{background:#42b883;box-shadow:0 0 0 3px color-mix(in srgb,#42b883 15%,transparent)}
.pet-health[data-valid="false"]{background:#e35d6a;box-shadow:0 0 0 3px color-mix(in srgb,#e35d6a 15%,transparent)}
.pet-state{font-size:8px;line-height:1;padding:3px 5px;border-radius:99px;background:color-mix(in srgb,var(--brand) 9%,transparent);color:var(--brand);flex:none}
.pet-state[data-state="done"]{background:color-mix(in srgb,#39a96b 10%,transparent);color:#39a96b}
.pet-card .sub{color:var(--ink2);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-card .bar{height:4px;border-radius:99px;background:var(--layer);overflow:hidden}
.pet-card .bar i{display:block;height:100%;background:var(--brand);transition:width .2s ease}
.pet-actions{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag;z-index:2}
.pet-open,.pet-settings{width:24px;height:24px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:14px;cursor:pointer}
.pet-open:hover,.pet-settings:hover{background:var(--layer);color:var(--ink)}
body.pet[data-pet-size="small"] .pet-state{display:none}
body.pet[data-pet-size="small"] .pet-card{grid-template-columns:46px minmax(0,1fr) 52px}

@media(max-width:900px){.inspector{position:absolute;right:0;top:0;bottom:0;z-index:10;box-shadow:-10px 0 30px color-mix(in srgb,var(--ink) 14%,transparent)}.docrail{position:absolute;left:0;top:0;bottom:0;z-index:10;box-shadow:10px 0 30px color-mix(in srgb,var(--ink) 14%,transparent)}.splitter{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo"><span class="spark">✦</span>AgentFlow Studio</span>
  <select id="flowSelect"></select>
  <span class="progress"><span class="bar"><i id="progressBar"></i></span><span id="progressText">–</span></span>
  <span class="sync-state" id="syncStatus">–</span>
  <button class="btn primary" id="btnNewFlow" data-i18n="newFlow">+ 新建</button>
  <button class="btn danger" id="btnDeleteFlow" data-i18n="deleteFlow">删除工作流</button>
  <button class="btn" id="btnValidate" data-i18n="validate">校验</button>
  <button class="btn" id="btnEvaluate" data-i18n="evaluate">求值</button>
  <button class="btn" id="btnLayout" data-i18n="layout">整理布局</button>
  <span class="status" id="status">–</span>
  <button class="btn mini" id="btnTheme" title="Light / Dark">🌓</button>
  <button class="btn mini" id="btnLang">EN</button>
  <button class="btn mini" id="btnCollapse" style="display:none">⌃</button>
</div>
<div class="main">
  <aside class="docrail" id="docrail">
    <div class="docrail-head">
      <span class="docrail-title" data-i18n="documents">文档</span>
      <button class="docrail-toggle" id="btnToggleDocrail" data-i18n-title="collapseExpand">‹</button>
    </div>
    <div class="docrail-list" id="docrailList"></div>

const state = {
  flows: [], id: null, detail: null,
  selected: null, selectedEdge: null,

async function api(path, options) {
  if (options) { const el = $("syncStatus"); if (el) { el.textContent = T.saving; el.className = "sync-state saving"; } }
  let data;
  try {
    const res = await fetch(path, options ? {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(options)
    } : undefined);
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || data.issues?.join("\n") || res.statusText);
    return data;
  } catch (e) {
    // 失败必须立刻恢复同步徽标，否则永远卡在「Saving...」。
    renderSync();
    if (data?.issues?.length && !data.error) showError(data.issues.join("\n"));
    else setStatus(String(e.message ?? e));
    throw e;
  }
}
const setStatus = (text) => { $("status").textContent = text; };
// 错误弹窗：嵌入式 webview 里 status 一行小字用户根本看不见。
function showError(message, title) {
  const bg = dialogBase(`<h3>${escapeHtml(title ?? T.opFailed)}</h3><p style="white-space:pre-wrap">${escapeHtml(message)}</p>
    <div class="actions"><button class="btn primary" data-x>${escapeHtml(T.ok)}</button></div>`);
  bg.querySelector("[data-x]").onclick = () => bg.remove();
}
function renderSync() {
  const el = $("syncStatus"), d = state.detail;
  if (!el) return;
  if (!d) { el.textContent = "–"; el.className = "sync-state"; return; }
  const ok = d.execution?.synced && d.execution?.executable;
    el.textContent = ok ? `${T.synced}${d.execution?.cyclic ? (LANG === "zh" ? " · 控制环" : " · cyclic") : ""} · rev ${d.revision}` : `${T.notExecutable} · rev ${d.revision}`;
  el.className = `sync-state ${ok ? "ok" : "bad"}`;
  el.title = d.execution?.issues?.join("\n") || "";
}

/* ---------- 左侧文档边栏 ---------- */
function renderDocrail() {
  const rail = $("docrail");
  const list = $("docrailList");
  const d = state.detail;
  rail.classList.toggle("collapsed", !state.docrail.open);
  $("btnToggleDocrail").textContent = state.docrail.open ? "‹" : "›";
  rail.style.width = state.docrail.open ? `${state.docrail.width}px` : "42px";
  if (!state.docrail.open || !d) { list.innerHTML = ""; return; }

  const workflowDoc = d.workflowDoc || "WORKFLOW.md";
  const docRoot = d.docRoot || T.none;
  const isWorkflowActive = state.selected === null && state.selectedEdge === null;

  list.innerHTML = `
    <div class="docgroup">${escapeHtml(T.workflowDoc)}</div>
    <button class="docitem${isWorkflowActive ? " active" : ""}" data-doc="workflow">
      <span class="docitem__icon">MD</span>
      <span>
        <span class="docitem__label">${escapeHtml(workflowDoc)}</span>
        <span class="docitem__path">${escapeHtml(docRoot)}</span>
      </span>
    </button>
    <div class="docgroup">${escapeHtml(T.stepDocs)}</div>
    ${d.nodes.map((node, index) => `
      <button class="docitem${state.selected === node.id ? " active" : ""}" data-node="${escapeHtml(node.id)}">
        <span class="docitem__icon">${String(index + 1).padStart(2, "0")}</span>
        <span>
          <span class="docitem__label">${escapeHtml(node.label)}</span>
          <span class="docitem__path">${escapeHtml(node.path || `${node.id}/STEP.md`)}</span>
        </span>
      </button>
    `).join("")}`;

  for (const btn of list.querySelectorAll("[data-doc='workflow']")) {
    btn.addEventListener("click", () => { state.selected = null; state.selectedEdge = null; render(); });
  }
  for (const btn of list.querySelectorAll("[data-node]")) {
    btn.addEventListener("click", () => {
      const id = btn.dataset.node;
      selectNode(id);
      const node = nodeById(id);
      if (node) centerOnNode(node);
    });
  }
}

function centerOnNode(node) {
  const rect = $("canvas").getBoundingClientRect();
  state.view = {
    ...state.view,
    x: rect.width / 2 - (node.position.x + NW / 2) * state.view.zoom,
    y: rect.height / 2 - (node.position.y + NH / 2) * state.view.zoom
  };
  applyView();
}

$("btnToggleDocrail").addEventListener("click", () => {
  state.docrail.open = !state.docrail.open;
  renderDocrail();
});

$("leftSplitter").addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  event.preventDefault();
  if (!state.docrail.open) { state.docrail.open = true; renderDocrail(); }
  const startX = event.clientX;
  const startWidth = state.docrail.width;
  const oldCursor = document.body.style.cursor;
  const oldSelect = document.body.style.userSelect;
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  const onMove = (e) => {
    const delta = e.clientX - startX;
    state.docrail.width = Math.max(140, Math.min(520, startWidth + delta));
    renderDocrail();
  };
  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    document.body.style.cursor = oldCursor;
    document.body.style.userSelect = oldSelect;
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
});

/* ---------- 渲染 ---------- */
function nodeById(id) { return state.detail?.nodes.find((n) => n.id === id) ?? null; }

function edgeGeometry(edge) {
  const s = nodeById(edge.source), t = nodeById(edge.target);
  if (!s || !t) return null;
  const start = { x: s.position.x + NW, y: s.position.y + NH / 2 };
  const end = { x: t.position.x, y: t.position.y + NH / 2 };
  const forward = Math.max(54, Math.abs(end.x - start.x) * 0.46);
  const bend = end.x >= start.x ? forward : Math.max(90, forward * 0.7);
  return { start, end,
    path: `M ${start.x} ${start.y} C ${start.x + bend} ${start.y}, ${end.x - bend} ${end.y}, ${end.x} ${end.y}` };
}

function applyView() {
  $("stage").style.transform = `translate(${state.view.x}px,${state.view.y}px) scale(${state.view.zoom})`;
}

function edgeGroup(edge, svg, sp, tp) {
  const start = { x: sp.x + NW, y: sp.y + NH / 2 }, end = { x: tp.x, y: tp.y + NH / 2 };
  const forward = Math.max(54, Math.abs(end.x - start.x) * 0.46);
  const bend = end.x >= start.x ? forward : Math.max(90, forward * 0.7);
  const d = `M ${start.x} ${start.y} C ${start.x + bend} ${start.y}, ${end.x - bend} ${end.y}, ${end.x} ${end.y}`;
  const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
  group.setAttribute("class", "edge-group");
  const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
  hit.setAttribute("class", "edge-hit"); hit.setAttribute("d", d);
  hit.addEventListener("pointerdown", (e) => e.stopPropagation());
  hit.addEventListener("click", (e) => { e.stopPropagation(); selectEdge(edge.id); });
  const vis = document.createElementNS("http://www.w3.org/2000/svg", "path");
  vis.setAttribute("class", `edge ${edge.state || "pending"}` + (state.selectedEdge === edge.id ? " sel" : ""));
  vis.setAttribute("d", d); vis.setAttribute("marker-end", "url(#arrow)");
  group.append(hit, vis);
  if (edge.label) {
    const lg = document.createElementNS("http://www.w3.org/2000/svg", "g");
    lg.setAttribute("transform", `translate(${(start.x + end.x) / 2} ${(start.y + end.y) / 2})`);
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("class", "edge-label-bg"); bg.setAttribute("x", -18); bg.setAttribute("y", -10);
    bg.setAttribute("width", 36); bg.setAttribute("height", 20); bg.setAttribute("rx", 7);
    const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tx.setAttribute("class", "edge-label"); tx.textContent = edge.label;
    lg.append(bg, tx); group.append(lg);
  }
  svg.append(group);
}

function render() {
  updateAddbar();
  renderDocrail();
  // 宠物迷你模式只更新卡片，不渲染整张画布（窗口只有卡片大小）。
  if (petMode) { updatePet(); return; }
  const d = state.detail;
  $("flowSelect").innerHTML = state.flows.map((f) =>
    `<option value="${escapeHtml(f.id)}" ${f.id === state.id ? "selected" : ""}>${escapeHtml(f.name)}（${f.done}/${f.total}）</option>`).join("");
  const svg = $("edgesSvg");
  [...svg.querySelectorAll(".edge-group,.conn")].forEach((el) => el.remove());
  const layer = $("nodesLayer");
  layer.innerHTML = "";
  if (!d) {
    $("emptyState").style.display = "grid";
    // 空状态隐藏右侧检查器（此时只有占位内容），提示卡片才能在整个画布居中。
    $("inspector").style.display = "none";
    const msg = $("emptyMsg");
    if (!state.flows || state.flows.length === 0) msg.innerHTML = T.emptyNoFlows;
    else msg.innerHTML = T.emptyPickFlow;
    renderSync(); updatePet(); return;
  }
  $("emptyState").style.display = "none";
  $("inspector").style.display = "";
  renderSync();
  $("progressText").textContent = `${d.progress.done}/${d.progress.total}`;
  $("progressBar").style.width = (d.progress.total ? Math.round(d.progress.done / d.progress.total * 100) : 0) + "%";

  for (const edge of d.edges) {
    const s = nodeById(edge.source), t = nodeById(edge.target);
    if (!s || !t) continue;
    const sp = state.liveDrag?.id === edge.source ? state.liveDrag.position : s.position;
    const tp = state.liveDrag?.id === edge.target ? state.liveDrag.position : t.position;
    edgeGroup(edge, svg, sp, tp);
  }

  for (const node of d.nodes) {
    const el = document.createElement("div");
    const pos = state.liveDrag?.id === node.id ? state.liveDrag.position : node.position;
    el.className = `node k-${node.kind}` +
      (state.selected === node.id ? " sel" : "") +
      (node.ready && !node.done ? " ready" : "") +
      (node.skipped ? " skipped" : "") +
      (state.conn?.hover === node.id ? " hover-target" : "") +
      (state.liveDrag?.id === node.id ? " dragging" : "");
    el.style.left = pos.x + "px"; el.style.top = pos.y + "px";
    el.dataset.id = node.id;
    const kindText = node.kind === "condition" && node.gateType
      ? `${KIND_LABELS[node.kind]} · <span class="gate-chip">${T.gateShort[node.gateType] ?? node.gateType}</span>`
      : KIND_LABELS[node.kind] ?? node.kind;
    el.innerHTML = `
      ${node.done ? '<span class="done-mark">✓</span>' : ""}
      <div class="card">
        <div class="kind">${kindText}</div>
        <div class="nlabel">${escapeHtml(node.label)}</div>
        ${node.content ? `<div class="nprompt">${escapeHtml(node.content)}</div>` : ""}
        <div class="npath">${escapeHtml(node.path)}</div>
        ${node.kind === "condition" && node.formula ? `<div class="formula">${escapeHtml(node.formula)}</div>` : ""}
      </div>
      <button class="handle t" title="in"></button>
      <button class="handle s" title="out"></button>`;
    el.addEventListener("pointerdown", (e) => beginNodeDrag(node, e));
    el.addEventListener("click", (e) => { e.stopPropagation(); selectNode(node.id); });
    el.querySelector(".handle.s").addEventListener("pointerdown", (e) => beginConnect(node, e));
    el.querySelector(".handle.t").addEventListener("pointerdown", (e) => e.stopPropagation());
    layer.append(el);
  }

  if (state.conn) {
    const s = nodeById(state.conn.source);
    if (s) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "conn");
      const sx = s.position.x + NW, sy = s.position.y + NH / 2;
      const { x, y } = state.conn.end;
      const bend = Math.max(54, Math.abs(x - sx) * 0.46);
      path.setAttribute("d", `M ${sx} ${sy} C ${sx + bend} ${sy}, ${x - bend} ${y}, ${x} ${y}`);
      svg.append(path);
    }
  }
  updatePet();
  renderInspector();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function updatePet() {
  if (!petMode) return;
  const d = state.detail;
  const avatar = $("petAvatar");
  const badge = $("petState");
  const health = $("petHealth");
  $("petCard").style.display = "grid";
  if (!d) {
    $("petName").textContent = "AgentFlow";
    $("petNext").textContent = T.noFlow;
    $("petBar").style.width = "0%";
    badge.textContent = T.petIdle;
    badge.dataset.state = "idle";
    avatar.dataset.state = "idle";
    health.dataset.valid = "unknown";
    health.title = T.petUnknown;
    return;
  }
  const summary = state.flows.find((flow) => flow.id === state.id);
  health.dataset.valid = summary?.valid === true ? "true" : summary?.valid === false ? "false" : "unknown";
  health.title = summary?.valid === true ? T.petHealthy
    : summary?.valid === false ? `${T.petBroken}${summary.issues?.length ? `：${summary.issues[0]}` : ""}`
    : T.petUnknown;
  $("petName").textContent = d.name;
  const readyNode = d.nodes.find((n) => n.ready && !n.done);
  const completed = d.progress.total > 0 && d.progress.done >= d.progress.total;
  const petState = completed ? "done" : "working";
  $("petNext").textContent = readyNode ? `${T.petNext}${readyNode.label}` : T.petAllDone;
  $("petBar").style.width = (d.progress.total ? Math.round(d.progress.done / d.progress.total * 100) : 0) + "%";
  badge.textContent = completed ? T.petDone : T.petWorking;
  badge.dataset.state = petState;
  avatar.dataset.state = petState;
}

  state.selected = id; state.selectedEdge = null; state.dirtySel = null;

}

  body.innerHTML = `

    ${node.kind === "condition" ? `<label>${T.gateTitle}<select id="insGate">${GATES.map(([g, name]) => `<option value="${g}" ${g === node.gateType ? "selected" : ""}>${name}</option>`).join("")}</select></label>
    <label>predicate<select id="insPredicate">${["truthy","falsy","nonEmpty"].map((p) => `<option ${p === node.predicate ? "selected" : ""}>${p}</option>`).join("")}</select></label>
    <label>${T.valuePath}<input id="insValuePath" value="${escapeHtml(node.valuePath || "")}" placeholder="$.passed"></label>` : ""}
    <label>${T.markdown}<textarea id="insDoc" spellcheck="false">${escapeHtml(draft)}</textarea></label>
    ${["agent","mapAgent","output"].includes(node.kind) ? `<label>${T.resultJson}<textarea id="insResult" spellcheck="false" style="min-height:72px">${node.result === undefined ? "" : escapeHtml(JSON.stringify(node.result, null, 2))}</textarea></label>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap">

      ${["agent","mapAgent","output"].includes(node.kind) ? `<button class="btn ${node.done ? "" : "primary"}" id="insToggleDone">${node.done ? T.undoDone : T.markDone}</button>` : ""}

  });
  const gateSel = $("insGate");
  if (gateSel) gateSel.addEventListener("change", async (e) => {
    try { await api(postUrl("node-patch"), { nodeId: node.id, patch: { gateType: e.target.value } }); await refresh(); }
    catch (err) { setStatus(err.message); }
  });
  const predSel = $("insPredicate");
  if (predSel) predSel.addEventListener("change", async (e) => {

  $("insDeleteNode").onclick = async () => {
    if (!confirm(`${T.deleteNode}: ${node.label}?`)) return;
    try { await api(postUrl("node-delete"), { nodeId: node.id }); state.selected = null; await refresh(); }
    catch (e) { setStatus(e.message); }
  };
}

/* ---------- 画布手势 ---------- */
function screenToWorld(cx, cy) {
  const rect = $("canvas").getBoundingClientRect();
  return { x: (cx - rect.left - state.view.x) / state.view.zoom, y: (cy - rect.top - state.view.y) / state.view.zoom };
}
function viewCenter() {
  const rect = $("canvas").getBoundingClientRect();
  return { x: (rect.width / 2 - state.view.x) / state.view.zoom - NW / 2, y: (rect.height / 2 - state.view.y) / state.view.zoom - NH / 2 };
}

function beginNodeDrag(node, event) {
  if (event.button !== 0 || event.target.closest(".handle")) return;
  event.preventDefault(); event.stopPropagation();
  selectNode(node.id);
  const startX = event.clientX, startY = event.clientY, origin = node.position;
  state.liveDrag = { id: node.id, position: origin };
  let latest = origin;
  const move = (e) => {
    latest = { x: origin.x + (e.clientX - startX) / state.view.zoom, y: origin.y + (e.clientY - startY) / state.view.zoom };
    state.liveDrag = { id: node.id, position: latest };
    const card = $("nodesLayer").querySelector(`.node[data-id="${node.id}"]`);
    if (card) { card.style.left = latest.x + "px"; card.style.top = latest.y + "px"; }
    const svg = $("edgesSvg");
    [...svg.querySelectorAll(".edge-group")].forEach((el) => el.remove());
    for (const edge of state.detail.edges) {
      const s = nodeById(edge.source), t = nodeById(edge.target);
      if (!s || !t) continue;
      const sp = edge.source === node.id ? latest : s.position;
      const tp = edge.target === node.id ? latest : t.position;
      edgeGroup(edge, svg, sp, tp);
    }
  };
  const up = async () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    state.liveDrag = null;
    if (latest !== origin) {
      try { await api(postUrl("position"), { nodeId: node.id, x: latest.x, y: latest.y }); } catch (e) { setStatus(e.message); }
      await refresh();
    }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function beginConnect(node, event) {
  if (event.button !== 0) return;
  event.preventDefault(); event.stopPropagation();
  state.conn = { source: node.id, end: screenToWorld(event.clientX, event.clientY), hover: null };
  const move = (e) => {
    state.conn.end = screenToWorld(e.clientX, e.clientY);
    state.conn.hover = document.elementFromPoint(e.clientX, e.clientY)?.closest(".node")?.dataset?.id ?? null;
    render();
  };
  const up = async (e) => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".node")?.dataset?.id ?? null;
    const source = state.conn.source;
    state.conn = null;
    render();
    if (!target || target === source) return;
    await connect(source, target);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

async function connect(source, target, branch) {
  try {
    const result = await api(postUrl("edge-add"), branch ? { source, target, branch } : { source, target });
    if (result.ok === false && result.code === "choose-branch") {
      chooseBranch(result.available, (picked) => connect(source, target, picked));
      return;
    }
    setStatus(T.edgeAdded); await refresh();
  } catch (e) { setStatus(e.message); }
}

function dialogBase(html) {
  const bg = document.createElement("div");

  bg.addEventListener("pointerdown", (e) => { if (e.target === bg) bg.remove(); });

}

    <div class="actions"><button class="btn" data-x>${T.cancel}</button></div>`);

/* ---------- 画布平移缩放 ---------- */
const canvas = $("canvas");
canvas.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || event.target.closest(".node,.controls,.inspector,.dialog-bg,.eval-panel,.pet-card")) return;
  event.preventDefault();
  const startX = event.clientX, startY = event.clientY, origin = { ...state.view };
  canvas.classList.add("panning");
  let moved = false;
  const move = (e) => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    state.view = { ...origin, x: origin.x + dx, y: origin.y + dy };
    applyView();
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    canvas.classList.remove("panning");
    if (!moved) { state.selected = null; state.selectedEdge = null; render(); }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
});
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const cx = event.clientX - rect.left, cy = event.clientY - rect.top;
  if (event.ctrlKey || event.metaKey) {
    const zoom = Math.min(2.5, Math.max(0.4, state.view.zoom * Math.exp(-event.deltaY * 0.0012)));
    state.view = {
      zoom,
      x: cx - (cx - state.view.x) * (zoom / state.view.zoom),
      y: cy - (cy - state.view.y) * (zoom / state.view.zoom)
    };
  } else {
    state.view = { ...state.view, x: state.view.x - (event.deltaX || 0), y: state.view.y - (event.deltaY || 0) };
  }
  applyView();
}, { passive: false });
$("zoomIn").onclick = () => zoomCenter(1.2);
$("zoomOut").onclick = () => zoomCenter(1 / 1.2);
$("fitView").onclick = () => fitView();
function zoomCenter(factor) {
  const rect = canvas.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const zoom = Math.min(2.5, Math.max(0.4, state.view.zoom * factor));
  state.view = { zoom, x: cx - (cx - state.view.x) * (zoom / state.view.zoom), y: cy - (cy - state.view.y) * (zoom / state.view.zoom) };
  applyView();
}
function fitView() {
  const d = state.detail;
  if (!d || d.nodes.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const minX = Math.min(...d.nodes.map((n) => n.position.x));
  const minY = Math.min(...d.nodes.map((n) => n.position.y));
  const maxX = Math.max(...d.nodes.map((n) => n.position.x + NW));
  const maxY = Math.max(...d.nodes.map((n) => n.position.y + NH));
  const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  const padding = Math.max(36, Math.min(rect.width, rect.height) * 0.16);
  const zoom = Math.min(1.15, Math.max(0.4, Math.min((rect.width - padding * 2) / w, (rect.height - padding * 2) / h)));
  state.view = { zoom, x: (rect.width - w * zoom) / 2 - minX * zoom, y: (rect.height - h * zoom) / 2 - minY * zoom };
  applyView();
}

  } catch (e) { setStatus(e.message); }
}

  bg.querySelector("[data-ok]").onclick = async () => {
    bg.remove();
    const target = state.id;
    try {
      await api(postUrl("flow-delete"), {});
      state.id = null; state.selected = null; state.selectedEdge = null;
      await refresh(); fitView();
      setStatus(`${T.flowDeleted}：${target}`);
    } catch (e) { setStatus(String(e.message ?? e)); }
  };
};
window.addEventListener("keydown", (event) => {
  const tag = event.target?.tagName?.toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (event.key === "Escape") { state.selected = null; state.selectedEdge = null; render(); }
  if (event.key === "Delete" || event.key === "Backspace") {
    if (state.selectedEdge) {
      event.preventDefault();
      api(postUrl("edge-delete"), { edgeId: state.selectedEdge }).then(refresh).catch((e) => setStatus(e.message));
    } else if (state.selected) {
      event.preventDefault();
      const node = nodeById(state.selected);
      if (node && confirm(`${T.deleteNode}: ${node.label}?`)) {
        api(postUrl("node-delete"), { nodeId: state.selected }).then(() => { state.selected = null; refresh(); }).catch((e) => setStatus(e.message));
      }
    }
  }
});

/* ---------- 数据加载与实时同步 ---------- */
function postUrl(action) { return `/api/flow/${encodeURIComponent(state.id)}/${action}`; }
async function refresh() { await loadList(); await loadDetail(); render(); }
async function loadList() {
  try { state.flows = await api("/api/flows"); } catch { /* 下轮重试 */ }
  if (!state.id || !state.flows.some((flow) => flow.id === state.id)) {
    state.id = state.flows[0]?.id ?? null;
    state.selected = null;
    state.selectedEdge = null;
    state.dirtySel = null;
  }
}
async function loadDetail() {
  if (!state.id) { state.detail = null; return; }
  try { state.detail = await api(`/api/flow/${encodeURIComponent(state.id)}`); }
  catch (e) { state.detail = null; }
}
let changeTimer = null;
const es = new EventSource("/api/events");
es.addEventListener("change", async () => {
  if (changeTimer) clearTimeout(changeTimer);
  changeTimer = setTimeout(async () => {
    const previousId = state.id;
    await loadList();
    if (!previousId && state.id) { await loadDetail(); fitView(); }
    else await loadDetail();
    render();
  }, 100);
});

(async function init() {
  await refresh();
  if (state.id) fitView();
  setStatus(state.id ? T.ready : T.emptyShort);
  if (window.petAPI) {
    $("btnCollapse").style.display = "inline-block";
    $("btnCollapse").addEventListener("click", () => window.petAPI.collapse());
  }
  if (petMode) {
    const avatar = $("petAvatar");
    let clickTimes = [];
    const react = (kind) => {
      avatar.classList.remove("poke", "flail");
      void avatar.offsetWidth;
      avatar.classList.add(kind);
    };
    avatar.addEventListener("click", () => {
      const now = Date.now();
      clickTimes = clickTimes.filter((t) => now - t < 900);
      clickTimes.push(now);
      if (clickTimes.length >= 4) { clickTimes = []; react("flail"); }
    });
    avatar.addEventListener("dblclick", (event) => {
      event.preventDefault();
      react("poke");
    });
    $("petSettings").title = T.petSettings;
    $("petSettings").addEventListener("click", (event) => {
      event.stopPropagation();
      window.petAPI?.settings?.();
    });
    $("petOpen").addEventListener("click", (event) => {
      event.stopPropagation();
      if (window.petAPI?.expand) window.petAPI.expand();
      else location.href = location.pathname;
    });
    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      window.petAPI?.contextMenu?.();
    });
  }
})();
</script>
